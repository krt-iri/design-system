e); font-weight: 700; }\n  code { font-family: var(--font-mono); font-size: .92em; color: var(--color-accent-light); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n  <div class=\"eyebrow\">Issue #781 · /personal-inventory/blueprints<\u002Fdiv>\n  <h1 class=\"t\">Craftbarkeit eigener Blueprints aus dem „Mein Lager\"-Bestand<\u002Fh1>\n  <p class=\"lead\">Die Blueprint-Seite beantwortet bisher nur „<b>welche<\u002Fb> Blueprints besitze ich\". #781 ergänzt die eigentlich gesuchte Antwort: „<b>Was kann ich davon JETZT craften<\u002Fb>, wie oft, welche Output-Stats bekomme ich bei meiner Material-Qualität — und was fehlt mir?\". Umgesetzt im <b>Master-Detail<\u002Fb>-Layout (V3) des DAS-KARTELL-Designsystems: dichte Liste links, permanente Craftability-Auswertung rechts.<\u002Fp>\n  <div class=\"prob\"><b>Streng nutzer-bezogen (JWT <code>sub<\u002Fcode>):<\u002Fb> nur meine Blueprints, mein „Mein Lager\"-Bestand (<code>InventoryItem<\u002Fcode>, echter Material-FK + Qualität je Stack), meine offenen/laufenden Raffinerie-Aufträge. Gewertet werden in v1 nur <b>RESOURCE<\u002Fb>-Zutaten über alle Lagerorte gepoolt; <b>ITEM<\u002Fb>-Zutaten bleiben sichtbar, sind aber als „nicht bewertet\" markiert.<p><\u002Fp>\n\n  <!-- ===================== DESKTOP ===================== -->\n  <div class=\"frame-label\"><h2>Desktop — primär<\u002Fh2><span class=\"fl-sub\">Master-Detail · KPI-Leiste · Refinery-Toggle · Filter/Sort · Live-Qualität<\u002Fspan><\u002Fdiv>\n\n  <div class=\"appframe\" id=\"desk\">\n    <header class=\"app-header\">\n      <button class=\"hamburger\" aria-label=\"Menü\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n      <a class=\"brand\" href=\"#\" onclick=\"return false\"><img src=\"c081bd65-dadb-4c9f-8744-4f3a39c7ec7c\" alt=\"DAS KARTELL\"><span class=\"logo-text\">Profit Basetool<\u002Fspan><\u002Fa>\n      <div class=\"ctx-chip\"><span class=\"lbl\">Staffel<\u002Fspan><span class=\"val\">IRI<\u002Fspan><\u002Fdiv>\n    <\u002Fheader>\n    <div class=\"app-body\">\n      <nav class=\"railnav\">\n        <a href=\"#\" onclick=\"return false\"><svg class=\"krt-icon\"><use href=\"#i-home\"><\u002Fuse><\u002Fsvg> Home<\u002Fa>\n        <a href=\"#\" onclick=\"return false\"><svg class=\"krt-icon\"><use href=\"#i-mission\"><\u002Fuse><\u002Fsvg> Missionen<\u002Fa>\n        <a href=\"#\" onclick=\"return false\"><svg class=\"krt-icon\"><use href=\"#i-ship\"><\u002Fuse><\u002Fsvg> Hangar<\u002Fa>\n        <span class=\"grp\">Mein Lager<\u002Fspan>\n        <a href=\"#\" onclick=\"return false\"><svg class=\"krt-icon\"><use href=\"#i-box\"><\u002Fuse><\u002Fsvg> Items<\u002Fa>\n        <a href=\"#\" class=\"active\" onclick=\"return false\"><svg class=\"krt-icon\"><use href=\"#i-blueprint\"><\u002Fuse><\u002Fsvg> Blueprints<\u002Fa>\n        <a href=\"#\" onclick=\"return false\"><svg class=\"krt-icon\"><use href=\"#i-refinery\"><\u002Fuse><\u002Fsvg> Raffinerie<\u002Fa>\n      <\u002Fnav>\n      <div class=\"app-main\">\n        <div class=\"pagehead\">\n          <div class=\"ph-top\">\n            <div>\n              <div class=\"crumb\">Mein Lager · Blueprints<\u002Fdiv>\n              <h1>Meine Blueprints<\u002Fh1>\n            <\u002Fdiv>\n            <div class=\"addbar\">\n              <input type=\"text\" placeholder=\"Blueprint suchen &amp; hinzufügen …\">\n              <button class=\"btn btn--cta btn-xs2\"><svg class=\"krt-icon\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg> Hinzufügen<\u002Fbutton>\n              <button class=\"btn btn-outline btn-xs2\"><svg class=\"krt-icon\"><use href=\"#i-upload\"><\u002Fuse><\u002Fsvg> JSON importieren<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"tab-nav\" role=\"tablist\">\n            <button class=\"tab\" role=\"tab\">Items<\u002Fbutton>\n            <button class=\"tab active\" role=\"tab\" aria-selected=\"true\">Blueprints <span class=\"tab-count\" id=\"tabCount\">7<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"facts-bar\" id=\"facts\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"bp-toolbar\">\n          <div class=\"search\"><svg class=\"krt-icon\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><input type=\"search\" id=\"filterText\" placeholder=\"In meiner Sammlung filtern …\"><\u002Fdiv>\n          <div class=\"seg\" id=\"craftFilter\">\n            <button data-f=\"all\" class=\"on\">Alle<\u002Fbutton>\n            <button data-f=\"craftable\">Nur craftbare<\u002Fbutton>\n          <\u002Fdiv>\n          <select class=\"sortsel\" id=\"sortSel\">\n            <option value=\"craft\">Sortieren: Craftbarkeit<\u002Foption>\n            <option value=\"name\">Sortieren: Name (A–Z)<\u002Foption>\n            <option value=\"date\">Sortieren: Erhalten am<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n\n        <div class=\"bp-md\">\n          <div class=\"mlist\" id=\"list\"><\u002Fdiv>\n          <div class=\"detail\" id=\"detail\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"appfoot\">\n          <span>Sichtbar nur für dich · Nutzer-bezogen (JWT sub)<\u002Fspan>\n          <span class=\"ver\">DAS KARTELL · Profit Basetool · v1.4.4<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== MOBILE ===================== -->\n  <div class=\"frame-label\"><h2>Smartphone &amp; Tablet<\u002Fh2><span class=\"fl-sub\">≤768px: Master-Detail kollabiert zu Liste → Detail-Navigation (Zurück-Button im Detail)<\u002Fspan><\u002Fdiv>\n  <div class=\"phones\">\n    <div class=\"phone\">\n      <div class=\"pcap\">Smartphone · Liste<\u002Fdiv>\n      <div class=\"pscreen\">\n        <header class=\"app-header\">\n          <button class=\"hamburger\" aria-label=\"Menü\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n          <a class=\"brand\" href=\"#\" onclick=\"return false\"><img src=\"c081bd65-dadb-4c9f-8744-4f3a39c7ec7c\" alt=\"\"><span class=\"logo-text\">Basetool<\u002Fspan><\u002Fa>\n          <div class=\"ctx-chip\"><span class=\"val\">IRI<\u002Fspan><\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"pscroll\">\n          <div class=\"phm-head\"><h1>Meine Blueprints<\u002Fh1><\u002Fdiv>\n          <div class=\"facts-bar\" id=\"mfacts\"><\u002Fdiv>\n          <div class=\"phm-list\" id=\"mlist\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"phone\">\n      <div class=\"pcap\">Smartphone · Detail (nach Auswahl)<\u002Fdiv>\n      <div class=\"pscreen\">\n        <header class=\"app-header\">\n          <button class=\"hamburger\" aria-label=\"Menü\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n          <a class=\"brand\" href=\"#\" onclick=\"return false\"><img src=\"c081bd65-dadb-4c9f-8744-4f3a39c7ec7c\" alt=\"\"><span class=\"logo-text\">Basetool<\u002Fspan><\u002Fa>\n          <div class=\"ctx-chip\"><span class=\"val\">IRI<\u002Fspan><\u002Fdiv>\n        <\u002Fheader>\n        <div class=\"pscroll phm-detail\">\n          <button class=\"back-btn\"><svg class=\"krt-icon\"><use href=\"#i-chev-left\"><\u002Fuse><\u002Fsvg> Zurück zur Liste<\u002Fbutton>\n          <div class=\"detail\" id=\"mdetail\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== RATIONALE / HANDOFF ===================== -->\n  <div class=\"frame-label\"><h2>Begründung &amp; Handoff<\u002Fh2><span class=\"fl-sub\">Warum dieses Layout · Abdeckung der Acceptance Criteria · Backend-Notiz<\u002Fspan><\u002Fdiv>\n  <div class=\"reco\">\n    <div class=\"rcard why\">\n      <h3><span class=\"num\">›<\u002Fspan> Warum Master-Detail (V3)<\u002Fh3>\n      <ul>\n        <li><b>#781 macht jeden Blueprint inhaltsreich:<\u002Fb> Craftbar-Zähler, projizierte Stats je Zutat-Qualität, Verbrauchs-Aufschlüsselung, Fehlbestand. Das passt nicht mehr in eine Tabellenzeile oder eine kleine Karte — die permanente Detail-Spalte zeigt es ohne Klickorgie.<\u002Fli>\n        <li><b>Liste bleibt dicht &amp; scanbar:<\u002Fb> der Craft-Status (<span class=\"craft-chip ok\" style=\"display:inline-flex\">×N<\u002Fspan> / <span class=\"craft-chip no\" style=\"display:inline-flex\">fehlt<\u002Fspan>) steht je Zeile rechts — die Kernfrage „was geht jetzt?\" ist schon in der Liste beantwortet.<\u002Fli>\n        <li><b>Eine Aktion pro Kontext:<\u002Fb> Orange bleibt für „Hinzufügen\" (CTA); Craftbarkeit nutzt Status-Grün/Warn-Gelb, Qualität nutzt Forschungs-Blau als Rechen-Akzent — keine Akzent-Überladung.<\u002Fli>\n        <li><b>Mobil:<\u002Fb> kollabiert sauber zu Liste → Detail mit Zurück-Button (≤768px), Touch-Ziele ≥44px.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rcard crit\">\n      <h3><span class=\"num\">✓<\u002Fspan> Acceptance Criteria — abgedeckt im Design<\u002Fh3>\n      <ul>\n        <li>Craftbar-Anzeige je Blueprint, RESOURCE-Zutaten über alle Lagerorte <b>gepoolt<\u002Fb>.<\u002Fli>\n        <li>Zähler <code>N = ⌊min(verfügbar / benötigt)<\u002Fcode> je Blueprint, limitierende Zutat benannt.<\u002Fli>\n        <li><b>Effektive Qualität<\u002Fb> beste-Stacks-zuerst, SCU-gewichtet → projizierte Output-Stats über das Modifier-Modell (linear; gestufte Segmente vorgesehen).<\u002Fli>\n        <li>Nicht-craftbare BPs listen <b>fehlendes Material + Fehlmenge in SCU<\u002Fb>.<\u002Fli>\n        <li><b>Refinery-Toggle<\u002Fb> (default AUS) faltet Yield aus <code>OPEN<\u002Fcode>+<code>IN_PROGRESS<\u002Fcode> ein und bewertet alles neu — inkl. Qualitätsbeitrag.<\u002Fli>\n        <li><b>ITEM<\u002Fb>-Zutaten sichtbar, klar „nicht bewertet\" (v1 out of scope).<\u002Fli>\n        <li>Streng nutzer-bezogen (JWT <code>sub<\u002Fcode>); de/en/Fallback i18n; responsive über alle vier Geräteklassen.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rcard api full\">\n      <h3><span class=\"num\">⟢<\u002Fspan> Backend-Notiz (read-only, keine Migration)<\u002Fh3>\n      <p>Ein neuer owner-scoped Lese-Endpoint liefert je persönlichem Blueprint das Craftability-Ergebnis; Query-Flag für Raffinerie-Yield. Neue DTO(s) → <code>openapi.json<\u002Fcode> + SpringDoc; Frontend-Call mit Resilience4j umhüllt wie jeder Backend-Call.<\u002Fp>\n      <ul>\n        <li><span class=\"meth\">GET<\u002Fspan> <b>/api/v1/personal-blueprints/craftability<\u002Fb>?includeRefinery={false|true}<\u002Fli>\n        <li>Quellen: <b>PersonalBlueprint<\u002Fb> → <b>BlueprintProductService<\u002Fb>/<b>BlueprintIngredient<\u002Fb> · Bestand <b>InventoryItem<\u002Fb> (user==me) · Yield <b>RefineryGood<\u002Fb> (OPEN/IN_PROGRESS)<\u002Fli>\n        <li>Stats: <b>BlueprintRequirementModifier<\u002Fb> — interpolieren modifierAtMinQuality…modifierAtMaxQuality über qualityMin…qualityMax, gestufte segments honorieren<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- icon sprite -->\n<svg style=\"display:none\" aria-hidden=\"true\">\n  <symbol id=\"i-plus\" viewBox=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-upload\" viewBox=\"0 0 24 24\"><path d=\"M12 15V3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M7 8l5-5 5 5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><path d=\"M5 21h14\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-search\" viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"6\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><\u002Fcircle><path d=\"M20 20l-4-4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-edit\" viewBox=\"0 0 24 24\"><path d=\"M14 4l6 6-11 11H3v-6z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-trash\" viewBox=\"0 0 24 24\"><path d=\"M5 7h14M9 7V4h6v3M7 7l1 14h8l1-14\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-home\" viewBox=\"0 0 24 24\"><path d=\"M4 11l8-7 8 7M6 10v9h12v-9\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-mission\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><\u002Fcircle><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-ship\" viewBox=\"0 0 24 24\"><path d=\"M3 12l18-6-7 6 7 6-18-6z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-box\" viewBox=\"0 0 24 24\"><path d=\"M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-blueprint\" viewBox=\"0 0 24 24\"><path d=\"M3 4h18v16H3z M3 9h18 M9 9v11\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-refinery\" viewBox=\"0 0 24 24\"><path d=\"M3 20h18M5 20v-8l5 3v-5l5 3V6l4 3v11\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-chev-left\" viewBox=\"0 0 24 24\"><path d=\"M15 6l-6 6 6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsymbol>\n<\u002Fsvg>\n\n<script>\n/* ============================================================================\n   Issue #781 — Craftability aus eigenem „Mein Lager\"-Bestand\n   Reine Demo-Berechnung im Browser; im Produkt liefert der Backend-Endpoint\n   das Ergebnis. Logik bildet die Akzeptanzkriterien 1:1 nach.\n   ========================================================================== */\n\n// --- Mein-Lager-Bestand: je Material Stacks {scu, q(0..1000), loc} -----------\nconst STOCK = {\n  Ouratite: [{scu:1.20,q:880,loc:'ARC-L1'},{scu:0.55,q:610,loc:'Area18'}],\n  Aslarite: [{scu:0.80,q:705,loc:'ARC-L1'}],\n  Laranite: [{scu:42,q:760,loc:'Lorville'},{scu:10,q:540,loc:'ARC-L1'}],\n  Gold:     [{scu:9,q:905,loc:'ARC-L1'}],\n  Tungsten: [{scu:8,q:520,loc:'Everus Harbor'}],\n  Quartz:   [{scu:31,q:430,loc:'Lorville'}],\n  Titanium: [{scu:24,q:600,loc:'ARC-L1'},{scu:6,q:880,loc:'Area18'}],\n  Bexalite: [{scu:2.1,q:980,loc:'Grim HEX'}],\n  Iron:     [{scu:120,q:350,loc:'Lorville'}],\n  Copper:   [{scu:18,q:560,loc:'Everus Harbor'}],\n};\n// --- Eigene Raffinerie-Aufträge (OPEN/IN_PROGRESS) Yield je Material ---------\nconst REFINERY = {\n  Aslarite: {scu:1.6,q:830,status:'IN_PROGRESS'},\n  Tungsten: {scu:26,q:690,status:'OPEN'},\n  Quartz:   {scu:55,q:505,status:'OPEN'},\n};\n\n// --- Meine Blueprints --------------------------------------------------------\n// ing: RESOURCE {kind, source, mat, req, affects:[{stat, max, dir}]}  dir: 'up'|'down'\n//      ITEM     {kind:'ITEM', source, name, qty}\nconst BLUEPRINTS = [\n  { id:'adp', name:'ADP Core', cat:'Armor', received:'2026-05-05', note:'Event vom 05.05. Zurückgelegt.',\n    ing:[\n      {kind:'RESOURCE', source:'Armored Carapace', mat:'Ouratite', req:0.07, affects:[{stat:'Damage Mitigation', max:1.15, dir:'up'}]},\n      {kind:'RESOURCE', source:'Insulative Liner', mat:'Aslarite', req:0.02, affects:[{stat:'Min Temp', max:1.20, dir:'up'},{stat:'Max Temp', max:1.20, dir:'up'}]},\n    ]},\n  { id:'qd', name:'Quantum Drive „Bolon XL-1\"', cat:'Quantum', received:'2026-04-28', note:'',\n    ing:[\n      {kind:'RESOURCE', source:'Quantum Core', mat:'Laranite', req:16, affects:[{stat:'Quantum-Treibstoffbedarf', max:0.90, dir:'down'}]},\n      {kind:'RESOURCE', source:'Spool Coil', mat:'Gold', req:8, affects:[{stat:'Spool-Zeit', max:0.88, dir:'down'}]},\n      {kind:'ITEM', source:'Kalibrierung', name:'Calibration Chip', qty:1},\n    ]},\n  { id:'salv', name:'Salvage Head „Abrade S2\"', cat:'Salvage', received:'2026-03-12', note:'',\n    ing:[\n      {kind:'RESOURCE', source:'Abrasion Tip', mat:'Tungsten', req:30, affects:[{stat:'Abtragsrate', max:1.18, dir:'up'}]},\n    ]},\n  { id:'pp', name:'Power Plant „Støten S2\"', cat:'Components', received:'2026-02-20', note:'',\n    ing:[\n      {kind:'RESOURCE', source:'Containment Cell', mat:'Quartz', req:25, affects:[{stat:'Energie-Output', max:1.14, dir:'up'}]},\n      {kind:'RESOURCE', source:'Heat Sink', mat:'Titanium', req:10, affects:[{stat:'Wärme-Erzeugung', max:0.90, dir:'down'}]},\n    ]},\n  { id:'mine', name:'Mining Laser „Helix\"', cat:'Mining', received:'2026-01-30', note:'',\n    ing:[\n      {kind:'RESOURCE', source:'Focusing Crystal', mat:'Bexalite', req:4, affects:[{stat:'Optimaler Ertrag', max:1.25, dir:'up'},{stat:'Fenstergröße', max:1.10, dir:'up'}]},\n    ]},\n  { id:'shield', name:'Shield Gen „Aegis S1\"', cat:'Components', received:'2026-01-12', note:'Basis-BP — sollte immer craftbar sein.',\n    ing:[\n      {kind:'RESOURCE', source:'Emitter Winding', mat:'Copper', req:6, affects:[{stat:'Regenerationsrate', max:1.12, dir:'up'}]},\n      {kind:'RESOURCE', source:'Frame', mat:'Iron', req:30, affects:[{stat:'Schild-HP', max:1.08, dir:'up'}]},\n    ]},\n  { id:'cool', name:'Cooler „Frostbite S1\"', cat:'Components', received:'2025-12-18', note:'',\n    ing:[\n      {kind:'RESOURCE', source:'Coolant Loop', mat:'Quartz', req:12, affects:[{stat:'Kühlrate', max:1.16, dir:'up'}]},\n      {kind:'RESOURCE', source:'Cryo Liner', mat:'Aslarite', req:0.05, affects:[{stat:'Min Temp', max:1.12, dir:'up'}]},\n    ]},\n];\n\n// --- Zahlformat (de) ---------------------------------------------------------\nconst nf = (n, d=2) => n.toLocaleString('de-DE', {minimumFractionDigits:0, maximumFractionDigits:d});\nconst scu = (n) => nf(n, n < 1 ? 3 : 2) + ' SCU';\n\n// --- verfügbare Stacks je Material (inkl. Raffinerie wenn toggle) ------------\nfunction stacksFor(mat, withRef) {\n  let s = (STOCK[mat] || []).map(x => ({...x, ref:false}));\n  if (withRef && REFINERY[mat]) { const r = REFINERY[mat]; s = s.concat([{scu:r.scu, q:r.q, loc:'Raffinerie', ref:true}]); }\n  return s;\n}\nconst availFor = (mat, withRef) => stacksFor(mat, withRef).reduce((a,b) => a + b.scu, 0);\n\n// beste-Qualität-zuerst Verbrauch über `need` SCU → {effQ, parts:[{scu,q,ref,loc}], covered}\nfunction consume(mat, need, withRef) {\n  const s = stacksFor(mat, withRef).sort((a,b) => b.q - a.q);\n  let rem = need, parts = [], wq = 0, used = 0;\n  for (const st of s) {\n    if (rem <= 1e-9) break;\n    const take = Math.min(st.scu, rem);\n    parts.push({scu:take, q:st.q, ref:st.ref, loc:st.loc});\n    wq += take * st.q; used += take; rem -= take;\n  }\n  return { effQ: used > 0 ? Math.round(wq / used) : 0, parts, covered: rem <= 1e-9 };\n}\n\n// --- Craftability je Blueprint ----------------------------------------------\nfunction craftOf(bp, withRef) {\n  const res = bp.ing.filter(i => i.kind === 'RESOURCE');\n  const items = bp.ing.filter(i => i.kind === 'ITEM');\n  let N = Infinity, limiting = null, ingres = [], missing = [];\n  for (const ing of res) {\n    const avail = availFor(ing.mat, withRef);\n    const per = Math.floor(avail / ing.req);\n    if (per < N) { N = per; limiting = ing; }\n    const c = consume(ing.mat, ing.req, withRef);\n    ingres.push({ing, avail, per, effQ:c.effQ, parts:c.parts, covered:c.covered});\n    if (avail < ing.req) missing.push({mat:ing.mat, have:avail, need:ing.req - avail, req:ing.req});\n  }\n  if (!isFinite(N)) N = 0;\n  // craftbar nur durch Raffinerie? (ohne Ref nicht craftbar)\n  let refOnly = false;\n  if (withRef && N >= 1) {\n    let nNo = Infinity; for (const ing of res) nNo = Math.min(nNo, Math.floor(availFor(ing.mat,false)/ing.req));\n    if (!isFinite(nNo)) nNo = 0; refOnly = nNo < 1;\n  }\n  return { N, limiting, ingres, missing, items, hasItem: items.length>0, refOnly };\n}\n\n// --- Modifier-Modell: f bei Qualität q (linear 1.0..max über 0..1000) -------\nfunction modifier(q, max) { const t = Math.max(0, Math.min(1000, q)) / 1000; return 1 + (max - 1) * t; }\nconst fmtMult = (f) => '×' + f.toFixed(2);\n\n// ============================================================================\n//  STATE + RENDER\n// ============================================================================\nconst state = { withRef:false, filter:'all', sort:'craft', text:'', selected:'adp',\n  overrides:{} /* key bpId|matIdx -> q */ , mselected:'adp' };\n\nfunction computedList(withRef) {\n  return BLUEPRINTS.map(bp => ({bp, c: craftOf(bp, withRef)}));\n}\n\nfunction filteredSorted() {\n  let rows = computedList(state.withRef);\n  if (state.text) { const t = state.text.toLowerCase(); rows = rows.filter(r => r.bp.name.toLowerCase().includes(t) || r.bp.cat.toLowerCase().includes(t)); }\n  if (state.filter === 'craftable') rows = rows.filter(r => r.c.N >= 1);\n  rows.sort((a,b) => {\n    if (state.sort === 'name') return a.bp.name.localeCompare(b.bp.name, 'de');\n    if (state.sort === 'date') return b.bp.received.localeCompare(a.bp.received);\n    // craft: craftbar zuerst, dann nach N desc, dann Name\n    const ac = a.c.N >= 1 ? 1 : 0, bc = b.c.N >= 1 ? 1 : 0;\n    if (ac !== bc) return bc - ac;\n    if (b.c.N !== a.c.N) return b.c.N - a.c.N;\n    return a.bp.name.localeCompare(b.bp.name, 'de');\n  });\n  return rows;\n}\n\nfunction craftChip(c) {\n  if (c.N >= 1) return `<span class=\"craft-chip ${c.refOnly?'ref':'ok'}\"><span class=\"dot\" style=\"background:currentColor\"><\u002Fspan>×${c.N}${c.refOnly?' ⟢':''}<\u002Fspan>`;\n  return `<span class=\"craft-chip no\"><span class=\"dot\" style=\"background:currentColor\"><\u002Fspan>fehlt<\u002Fspan>`;\n}\n\nconst dmy = (s) => { const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; };\n\n// ---- Liste ----\nfunction renderList(rootId, selKey, sel) {\n  const root = document.getElementById(rootId);\n  const rows = filteredSorted();\n  if (!rows.length) { root.innerHTML = `<div class=\"mlist-empty\">Keine Blueprints für diesen Filter.<\u002Fdiv>`; return; }\n  root.innerHTML = rows.map(r => `\n    <div class=\"mrow ${r.bp.id===sel?'on':''}\" data-id=\"${r.bp.id}\" data-sel=\"${selKey}\" tabindex=\"0\" role=\"button\">\n      <div>\n        <div class=\"mr-name\">${r.bp.name}<\u002Fdiv>\n        <div class=\"mr-meta\">${r.bp.cat} · erhalten ${dmy(r.bp.received)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mr-stat\">${craftChip(r.c)}<\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\n// ---- Detail ----\nfunction renderDetail(rootId, sel, mobile) {\n  const root = document.getElementById(rootId);\n  const bp = BLUEPRINTS.find(b => b.id === sel) || BLUEPRINTS[0];\n  const c = craftOf(bp, state.withRef);\n  const ok = c.N >= 1;\n\n  // banner\n  let bannerNote;\n  if (ok) {\n    bannerNote = `Limitiert durch <b>${c.limiting.mat}<\u002Fb> (${scu(c.limiting.req)}/Craft).` +\n      (c.refOnly ? ` <span class=\"cb-ref\">Nur dank Raffinerie-Yield craftbar.<\u002Fspan>` : '');\n  } else {\n    const m = c.missing.map(x => `<b>${x.mat}<\u002Fb> (fehlt ${scu(x.need)})`).join(', ');\n    bannerNote = `Es fehlt: ${m}.` + (!state.withRef && anyRefHelps(bp) ? ` <span class=\"cb-ref\">Mit Raffinerie-Yield evtl. craftbar — Schalter oben.<\u002Fspan>` : '');\n  }\n  const banner = `<div class=\"craft-banner ${ok?'ok':'no'}\">\n    <div class=\"cb-n\">${ok? '×'+c.N : '0'}<\u002Fdiv>\n    <div><div class=\"cb-main\">${ok? 'Jetzt craftbar' : 'Nicht craftbar'}<\u002Fdiv>\n    <div class=\"cb-note\">${bannerNote}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n\n  // ingredients\n  const ingHtml = bp.ing.map((ing, idx) => {\n    if (ing.kind === 'ITEM') {\n      return `<div class=\"ingred item\">\n        <div class=\"ig-top\"><div><div class=\"ig-src\">${ing.source}<\u002Fdiv>\n        <div class=\"ig-name\">${ing.name} <span class=\"ig-req\">×${ing.qty}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <span class=\"chip chip--muted\">nicht bewertet<\u002Fspan><\u002Fdiv>\n        <div class=\"item-note\">ITEM-Zutat — diskrete Spiel-Items werden in v1 <b>nicht<\u002Fb> gegen den Bestand geprüft.<\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n    const cr = c.ingres.find(x => x.ing === ing);\n    const okMat = cr.avail >= ing.req;\n    const key = bp.id + '|' + idx;\n    const calcQ = cr.effQ;\n    const curQ = state.overrides[key] != null ? state.overrides[key] : calcQ;\n    const overridden = state.overrides[key] != null && state.overrides[key] !== calcQ;\n    // consumption breakdown\n    const parts = cr.parts.length ? cr.parts.map(p =>\n      `${nf(p.scu, p.scu<1?3:2)}&nbsp;@&nbsp;${p.q}${p.ref?'<span class=\"ref-tag\">↻<\u002Fspan>':''}`).join(' + ') : '—';\n    const nb = (s) => s.replace(/ /g, '\\u00a0').replace(/-/g, '\\u2011');\n    const affects = ing.affects.map(a =>\n      `<span class=\"stat-chip\" data-aff=\"${key}\" data-max=\"${a.max}\" title=\"${a.dir==='up'?'höher ist besser':'niedriger ist besser'}\">${nb(a.stat)} <span class=\"sc-mult\">${fmtMult(modifier(curQ, a.max))}<\u002Fspan> <span class=\"sc-dir\">${a.dir==='up'?'↑':'↓'}<\u002Fspan><\u002Fspan>`\n    ).join(' ');\n    return `<div class=\"ingred\">\n      <div class=\"ig-top\">\n        <div><div class=\"ig-src\">${ing.source}<\u002Fdiv>\n          <div class=\"ig-name\">${ing.mat} <span class=\"ig-req\">· benötigt ${scu(ing.req)}/Craft<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"ig-avail\"><div class=\"av-v ${okMat?'ok':'short'}\">${scu(cr.avail)}<\u002Fdiv>\n          <div class=\"av-k\">verfügbar · ${stacksFor(ing.mat, state.withRef).length} Stack(s)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ig-consume\">verbraucht/Craft: <b>${parts}<\u002Fb><\u002Fdiv>\n      <div class=\"q-row\">\n        <input type=\"range\" min=\"0\" max=\"1000\" value=\"${curQ}\" data-q=\"${key}\" data-calc=\"${calcQ}\" ${mobile?'disabled':''}>\n        <span class=\"q-val\"><span data-qv=\"${key}\">${curQ}<\u002Fspan> <small>/ 1000<\u002Fsmall><\u002Fspan>\n        <span class=\"q-calc\">berechnet aus Bestand: <b data-qc=\"${key}\">${calcQ}<\u002Fb><\u002Fspan>\n        <button class=\"q-reset\" data-qr=\"${key}\" ${overridden?'':'hidden'}>zurücksetzen<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"affects\"><span class=\"arr\">→ projizierte Stats:<\u002Fspan> ${affects}<\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n\n  // missing\n  const missHtml = (!ok && c.missing.length) ? `<div class=\"d-section\">\n    <h4 class=\"st\">Fehlende Materialien <span class=\"st-hint\">— Fehlmenge bis zum ersten Craft<\u002Fspan><\u002Fh4>\n    <div class=\"miss-list\">${c.missing.map(x => `\n      <div class=\"miss-row\"><span class=\"mr-mat\">${x.mat}<\u002Fspan>\n        <span class=\"mr-have\">${scu(x.have)} / ${scu(x.req)} vorhanden<\u002Fspan>\n        <span class=\"mr-need\">fehlt ${scu(x.need)}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv>` : '';\n\n  const noteHtml = `<div class=\"d-section\">\n    <h4 class=\"st\">Notiz<\u002Fh4>\n    ${bp.note ? `<div class=\"d-note\">${bp.note}<\u002Fdiv>` : `<div class=\"d-note empty\">Keine Notiz hinterlegt.<\u002Fdiv>`}<\u002Fdiv>`;\n\n  root.innerHTML = `\n    <div class=\"d-head\">\n      <div><div class=\"d-title\">${bp.name}<\u002Fdiv>\n        <div class=\"d-sub\"><span class=\"chip chip--muted\">${bp.cat}<\u002Fspan> erhalten am ${dmy(bp.received)}${c.hasItem?' · <span class=\"chip chip--info\">enthält ITEM-Zutat<\u002Fspan>':''}<\u002Fdiv><\u002Fdiv>\n      <div class=\"d-actions\">\n        <button class=\"btn btn-ghost btn-ic\" title=\"Notiz bearbeiten\"><svg class=\"krt-icon\"><use href=\"#i-edit\"/><\u002Fsvg><\u002Fbutton>\n        <button class=\"btn btn-quiet-danger btn-ic\" title=\"Entfernen\"><svg class=\"krt-icon\"><use href=\"#i-trash\"/><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${banner}\n    <div class=\"d-section\">\n      <h4 class=\"st\">Zutaten · Bestand &amp; projizierte Stats <span class=\"st-hint\">— ↑/↓ = höher/niedriger ist besser · Slider spielt andere Qualitäten durch<\u002Fspan><\u002Fh4>\n      ${ingHtml}\n    <\u002Fdiv>\n    ${missHtml}\n    ${noteHtml}`;\n\n  // wire sliders (desktop only)\n  if (!mobile) {\n    root.querySelectorAll('[data-q]').forEach(sl => {\n      sl.addEventListener('input', () => {\n        const key = sl.dataset.q, q = +sl.value, calc = +sl.dataset.calc;\n        state.overrides[key] = q;\n        root.querySelector(`[data-qv=\"${cssEsc(key)}\"]`).textContent = q;\n        root.querySelectorAll(`[data-aff=\"${cssEsc(key)}\"]`).forEach(ch => {\n          ch.querySelector('.sc-mult').textContent = fmtMult(modifier(q, +ch.dataset.max));\n        });\n        const rb = root.querySelector(`[data-qr=\"${cssEsc(key)}\"]`); if (rb) rb.hidden = (q === calc);\n      });\n    });\n    root.querySelectorAll('[data-qr]').forEach(b => {\n      b.addEventListener('click', () => { delete state.overrides[b.dataset.qr]; renderDetail(rootId, sel, mobile); });\n    });\n  }\n}\n\nconst cssEsc = (s) => s.replace(/[|\"\\\\]/g, '\\\\$&');\nfunction anyRefHelps(bp) {\n  const withN = craftOf(bp, true).N, noN = craftOf(bp, false).N;\n  return withN >= 1 && noN < 1;\n}\n\n// ---- KPI / facts ----\nfunction renderFacts(rootId) {\n  const root = document.getElementById(rootId);\n  const total = BLUEPRINTS.length;\n  const nowN = computedList(false).filter(r => r.c.N >= 1).length;\n  const refN = computedList(true).filter(r => r.c.N >= 1).length;\n  const active = state.withRef ? refN : nowN;\n  const withNotes = BLUEPRINTS.filter(b => b.note).length;\n  const refDelta = refN - nowN;\n  const mini = rootId === 'mfacts';\n  root.innerHTML = `\n    <div><span class=\"fact-k\">Jetzt craftbar<\u002Fspan><span class=\"fact-v big\">${active}<span class=\"den\"> / ${total}<\u002Fspan><\u002Fspan>\n      ${(!state.withRef && refDelta>0) ? `<span class=\"ref-delta\"> +${refDelta} mit Raffinerie<\u002Fspan>`:''}<\u002Fdiv>\n    ${mini?'':`<div><span class=\"fact-k\">Blueprints<\u002Fspan><span class=\"fact-v\">${total}<\u002Fspan><\u002Fdiv>\n    <div><span class=\"fact-k\">Mit Notiz<\u002Fspan><span class=\"fact-v\">${withNotes}<\u002Fspan><\u002Fdiv>`}\n    <div class=\"ref-toggle ${state.withRef?'on':''}\" id=\"${mini?'mrefT':'refT'}\" role=\"switch\" aria-checked=\"${state.withRef}\" tabindex=\"0\">\n      <div class=\"rt-text\"><span class=\"rt-k\">Raffinerie-Yield<\u002Fspan><span class=\"rt-v\">${state.withRef?'wird eingerechnet':'aus'}<\u002Fspan><\u002Fdiv>\n      <div class=\"switch\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  const t = document.getElementById(mini?'mrefT':'refT');\n  const toggle = () => { state.withRef = !state.withRef; renderAll(); };\n  t.addEventListener('click', toggle);\n  t.addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter'){e.preventDefault();toggle();} });\n}\n\n// ---- wire list clicks ----\nfunction wireList(rootId) {\n  document.getElementById(rootId).querySelectorAll('.mrow').forEach(row => {\n    const pick = () => {\n      const id = row.dataset.id, which = row.dataset.sel;\n      if (which === 'm') state.mselected = id; else state.selected = id;\n      renderAll();\n    };\n    row.addEventListener('click', pick);\n    row.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){e.preventDefault();pick();} });\n  });\n}\n\nfunction renderAll() {\n  renderFacts('facts');\n  renderList('list', 'd', state.selected);\n  renderDetail('detail', state.selected, false);\n  wireList('list');\n  document.getElementById('tabCount').textContent = BLUEPRINTS.length;\n  // mobile\n  renderFacts('mfacts');\n  renderList('mlist', 'm', state.mselected);\n  renderDetail('mdetail', state.mselected, true);\n  wireList('mlist');\n}\n\n// ---- controls ----\ndocument.getElementById('filterText').addEventListener('input', e => { state.text = e.target.value; renderAll(); });\ndocument.getElementById('craftFilter').querySelectorAll('button').forEach(b => {\n  b.addEventListener('click', () => {\n    state.filter = b.dataset.f;\n    document.getElementById('craftFilter').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));\n    renderAll();\n  });\n});\ndocument.getElementById('sortSel').addEventListener('change', e => { state.sort = e.target.value; renderAll(); });\n\nrenderAll();\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fbody><\u002Fhtml>"
  </script>
